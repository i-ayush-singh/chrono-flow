name: Release and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment label"
        required: true
        default: "dev"
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: "chronoflow"

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish Service Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: chrono-job-service
            image: chrono-job-service
          - module: chrono-scheduler-service
            image: chrono-scheduler-service
          - module: chrono-executor-service
            image: chrono-executor-service
          - module: chrono-api-gateway
            image: chrono-api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with Jib
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          JIB_TO_AUTH_USERNAME: ${{ github.actor }}
          JIB_TO_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -pl ${{ matrix.module }} -am -DskipTests \
            com.google.cloud.tools:jib-maven-plugin:3.4.3:build \
            -Dimage=${IMAGE}:${GITHUB_SHA} \
            -Djib.to.tags=latest

  deploy:
    name: Helm Deploy
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "${KUBE_CONFIG_DATA}" ]; then
            echo "KUBE_CONFIG_DATA secret is required for deploy job."
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > "${HOME}/.kube/config"

      - name: Deploy with Helm
        run: |
          helm upgrade --install chronoflow helm/chronoflow \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --set services.job.image=ghcr.io/${{ github.repository_owner }}/chrono-job-service:${GITHUB_SHA} \
            --set services.scheduler.image=ghcr.io/${{ github.repository_owner }}/chrono-scheduler-service:${GITHUB_SHA} \
            --set services.executor.image=ghcr.io/${{ github.repository_owner }}/chrono-executor-service:${GITHUB_SHA} \
            --set services.gateway.image=ghcr.io/${{ github.repository_owner }}/chrono-api-gateway:${GITHUB_SHA}
